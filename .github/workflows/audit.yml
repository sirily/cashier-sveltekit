name: Dependency audit

on:
  pull_request:
    branches:
      - main
      - 'releases/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'

      - name: Test audit report helper
        run: node --test scripts/audit-report-tests.mjs

      - name: Audit locked dependencies
        run: node scripts/audit-report.mjs
