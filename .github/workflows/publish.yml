name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan final release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'

      - name: Plan final release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs plan-final

  checks:
    if: needs.plan.outputs.eligible == 'true'
    needs: plan
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: Publish final image and release
    if: needs.plan.outputs.eligible == 'true'
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_IMAGE: ${{ needs.plan.outputs.image }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing final image
        id: image
        run: node scripts/release.mjs image-status

      - name: Set up QEMU
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push final image
        if: steps.image.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.tag }}
          annotations: |
            index:org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            index:org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create final Git tag, GitHub Release, and latest alias
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.image.outputs.digest }}
        run: node scripts/release.mjs finish-final
