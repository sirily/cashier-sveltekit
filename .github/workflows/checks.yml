name: Checks

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - 'releases/**'

permissions:
  contents: read

# Cancel superseded PR checks without replacing queued checks for other image-build runs.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Test CI and release tooling
        run: node --test scripts/*-tests.mjs

      - name: Install dependencies
        id: install
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Svelte template lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:svelte

      - name: Validate OpenSpec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:specs
        env:
          OPENSPEC_TELEMETRY: '0'

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit -- --run

      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:build

      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install chromium --with-deps

      - name: Browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:e2e

      - name: Upload failed browser test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-reports-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    uses: ./.github/workflows/audit.yml
